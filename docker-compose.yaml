name: feature-flag-service
services:
  postgres:
    image: postgres:17
    container_name: feature-flag-service-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - feature-flag-service-db:/var/lib/postgresql/data
  redis:
    image: redis:8
    container_name: feature-flag-service-redis
    ports:
      - "6379:6379"
    volumes:
      - feature-flag-service-redis:/data
volumes:
  feature-flag-service-db:
  feature-flag-service-redis:
