$kind: http-request
name: Create Environment
method: POST
url: "{{baseUrl}}{{apiPrefix}}/projects/{{projectId}}/environments"
order: 1000
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
  organization-id: "{{organizationId}}"
scripts:
  - type: beforeRequest
    code: |-
      const envName = "Env_" + pm.variables.replaceIn("{{$randomWord}}");
      const setVariable = (key, value) => {
        pm.collectionVariables.set(key, value);
        if (pm.environment.name) {
          pm.environment.set(key, value);
        }
      };
      setVariable("tempEnvName", envName);
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const responseBody = pm.response.json();
        const data = responseBody.data;
        const setVariable = (key, value) => {
          pm.collectionVariables.set(key, value);
          if (pm.environment.name) {
            pm.environment.set(key, value);
          }
        };

        if (data.id) {
          setVariable("environmentId", data.id);
        }
        if (data.plaintextApiKey) {
          setVariable("environmentApiKey", data.plaintextApiKey);
        }
      }
    language: text/javascript
body:
  type: json
  content: |-
    {
      "name": "{{tempEnvName}}"
    }
