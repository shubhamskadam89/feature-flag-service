$kind: http-request
name: Create Project
method: POST
url: "{{baseUrl}}{{apiPrefix}}/projects"
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
order: 2000
headers:
  Content-Type: application/json
scripts:
  - type: beforeRequest
    code: |-
      const projectName = pm.variables.replaceIn("{{$randomCompanyName}}");
      const setVariable = (key, value) => {
        pm.collectionVariables.set(key, value);
        if (pm.environment.name) {
          pm.environment.set(key, value);
        }
      };

      setVariable("projectName", projectName);
    language: text/javascript
  - type: afterResponse
    code: |-
      if (pm.response.code === 201 || pm.response.code === 200) {
        const responseBody = pm.response.json();
        const projectData = responseBody.data || responseBody;
        const setVariable = (key, value) => {
          pm.collectionVariables.set(key, value);
          if (pm.environment.name) {
            pm.environment.set(key, value);
          }
        };

        if (projectData.id) {
          setVariable("projectId", projectData.id);
        }
      }
    language: text/javascript
body:
  type: json
  content: |-
    {
      "projectName": "{{projectName}}"
    }
